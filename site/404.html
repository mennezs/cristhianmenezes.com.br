<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0000a0" />
    <link rel="icon" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <title>Cristhian Menezes :] 404</title>

    <!--
      Página de erro servida pelo Apache (ver /.htaccess → ErrorDocument).
      Ela aparece em QUALQUER URL inexistente (ex.: /a/b/c), então todos os
      caminhos aqui precisam ser absolutos (começando com "/").
    -->

    <link rel="preload" href="/fonts/Comic_CAT.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&display=swap" rel="stylesheet" />

    <style>
      @font-face {
        font-family: "Comic CAT";
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src:
          url(/fonts/Comic_CAT.woff2) format("woff2"),
          url(/fonts/Comic_CAT.woff) format("woff");
        unicode-range: U+0020-007E;
      }

      :root {
        --blue: #0000a0;
        --black: #1c1c1c;
        --grey: #c9c9c9;
        --white: #ffffff;
        --radius-panel: 2rem;
        --elastic: cubic-bezier(0.34, 1.56, 0.64, 1);
        --ease-out: cubic-bezier(0.25, 0.46, 0.45, 0.94);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        min-height: 100svh;
        background-color: var(--blue);
      }

      body {
        display: grid;
        place-items: center;
        padding: 2rem 1rem;
        font-family: "Comic CAT", "Comic Neue", sans-serif;
        text-transform: uppercase;
        color: var(--white);
        text-align: center;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      ::selection {
        color: var(--black);
        background-color: var(--white);
      }

      /* ---- Plaquinha pendurada ---------------------------------------- */

      /* entra caindo (uma vez) */
      .scene {
        width: 100%;
        max-width: 30rem;
        animation: drop 1.1s var(--elastic) both;
      }

      /* balança presa no prego (eixo no topo) */
      .hanger {
        position: relative;
        transform-origin: 50% 0;
        animation: swing 4s ease-in-out infinite;
      }

      /* prego */
      .nail {
        position: absolute;
        top: 0;
        left: 50%;
        z-index: 2;
        width: 1rem;
        height: 1rem;
        margin-left: -0.5rem;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 35%, var(--white), var(--grey) 45%, #7a7a7a);
        box-shadow: 0 2px 4px rgb(0 0 0 / 0.4);
      }

      /* cordinha: termina dentro dos furos da placa */
      .rope {
        position: relative;
        z-index: 1;
        display: block;
        width: 100%;
        height: 5rem;
        margin-bottom: -1.5rem;
        overflow: visible;
      }

      .rope line {
        stroke: var(--grey);
        stroke-width: 3;
        stroke-linecap: round;
        vector-effect: non-scaling-stroke;
      }

      .card {
        position: relative;
        padding: 3rem 1.5rem 2.25rem;
        background-color: var(--black);
        border-radius: var(--radius-panel);
        display: flex;
        flex-direction: column;
        align-items: center;
        /* moldura interna de placa */
        box-shadow:
          inset 0 0 0 0.625rem var(--black),
          inset 0 0 0 0.8rem var(--grey),
          0 1.5rem 2.5rem -1rem rgb(0 0 0 / 0.5);
      }

      /* furos da placa (alinhados com as pontas da corda: 15% / 85%) */
      .card::before,
      .card::after {
        content: "";
        position: absolute;
        top: 1.5rem;
        width: 0.75rem;
        height: 0.75rem;
        margin: -0.375rem 0 0 -0.375rem;
        border-radius: 50%;
        background-color: var(--blue);
        box-shadow: inset 0 2px 3px rgb(0 0 0 / 0.6);
      }

      .card::before {
        left: 15%;
      }

      .card::after {
        left: 85%;
      }

      .avatar {
        width: 7rem;
        height: 7rem;
        border-radius: 50%;
      }

      .code {
        margin-top: 1rem;
        font-size: clamp(4.5rem, 22vw, 7rem);
        line-height: 1;
        letter-spacing: -0.04em;
      }

      .title {
        margin-top: 0.5rem;
        font-weight: 400;
        font-size: 1.375rem;
        line-height: 1.15;
        text-wrap: balance;
      }

      .text {
        margin-top: 0.75rem;
        color: var(--grey);
        font-size: 1.0625rem;
        line-height: 1.25;
        text-wrap: balance;
      }

      .actions {
        margin-top: 1.75rem;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.75rem;
      }

      .btn {
        padding: 0.875rem 1.5rem;
        border-radius: 999px;
        border: 2px solid var(--white);
        color: var(--white);
        font-size: 1.0625rem;
        text-decoration: none;
        transition:
          transform 0.6s var(--elastic),
          background-color 0.15s var(--ease-out),
          color 0.15s var(--ease-out);
      }

      .btn--primary {
        background-color: var(--white);
        color: var(--black);
      }

      .btn:hover,
      .btn:focus-visible {
        transform: scale(1.06) rotate(-2deg);
        background-color: var(--white);
        color: var(--black);
        outline: none;
      }

      .btn:active {
        transform: scale(0.96);
        transition-duration: 0.1s;
      }

      @keyframes drop {
        from {
          opacity: 0;
          transform: translateY(-3rem);
        }
      }

      @keyframes swing {
        0%, 100% { transform: rotate(-2.5deg); }
        50% { transform: rotate(2.5deg); }
      }

      @media (prefers-reduced-motion: reduce) {
        .scene,
        .hanger {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="scene">
      <div class="hanger">
        <span class="nail" aria-hidden="true"></span>
        <svg class="rope" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
          <line x1="50" y1="10" x2="15" y2="100" />
          <line x1="50" y1="10" x2="85" y2="100" />
        </svg>
        <main class="card">
          <img class="avatar" src="/links/icons/avatar.png" alt="" width="112" height="112" />
          <p class="code" aria-hidden="true">404</p>
          <h1 class="title">Página não encontrada</h1>
          <p class="text">O link que você tentou abrir não existe ou mudou de lugar.</p>
          <nav class="actions">
            <a class="btn btn--primary" href="/">Voltar pro início</a>
            <a class="btn" href="/links/">Meus links</a>
          </nav>
        </main>
      </div>
    </div>
  </body>
</html>
