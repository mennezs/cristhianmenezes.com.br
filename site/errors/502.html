<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0000a0" />
    <link rel="icon" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <title>Cristhian Menezes :] Falha na conexão</title>

    <!--
      Página de erro 502. Só aparece se o próprio Apache gerar o erro; se vier de um proxy na frente dele, quem responde é o proxy.
      Estilo em /errors/error.css. Use sempre caminhos absolutos (começando com "/").
    -->

    <link rel="preload" href="/fonts/Comic_CAT.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/errors/error.css" />
  </head>
  <body>
    <div class="scene">
      <div class="hanger">
        <span class="nail" aria-hidden="true"></span>
        <svg class="rope" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
          <line x1="50" y1="10" x2="15" y2="100" />
          <line x1="50" y1="10" x2="85" y2="100" />
        </svg>
        <main class="card">
          <img class="avatar" src="/links/icons/avatar.png" alt="" width="112" height="112" />
          <p class="code" aria-hidden="true">502</p>
          <h1 class="title">Falha na conexão</h1>
          <p class="text">Um servidor no meio do caminho não respondeu direito. Tenta de novo daqui a pouco.</p>
          <nav class="actions">
            <button class="btn btn--primary" type="button" onclick="location.reload()">Tentar de novo</button>
            <a class="btn" href="/">Voltar pro início</a>
          </nav>
        </main>
      </div>
    </div>
  </body>
</html>
