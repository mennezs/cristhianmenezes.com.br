    <!--
      Navegador incompatível: o Three.js do bundle exige WebGL 2. Sem ele, manda
      pra /errors/unsupported.html. Robôs (Google etc.) são ignorados para não
      indexarem a página de erro no lugar do site.
    -->
    <script>
      (function () {
        if (/bot|crawl|spider|slurp|lighthouse|preview/i.test(navigator.userAgent)) return;
        var ok = false;
        try {
          var gl = window.WebGL2RenderingContext && document.createElement("canvas").getContext("webgl2");
          ok = !!gl;
          var lose = gl && gl.getExtension("WEBGL_lose_context");
          if (lose) lose.loseContext();
        } catch (e) {}
        if (!ok) location.replace("/errors/unsupported.html");
      })();
    </script>
    <!-- onerror: se o JS ou o CSS principal não carregarem, mostra /errors/resource.html -->
    <script type="module" crossorigin src="/assets/main.js" onerror="location.replace('/errors/resource.html')"></script>
    <link rel="stylesheet" crossorigin href="/assets/main.css" onerror="location.replace('/errors/resource.html')">
    <!-- Service worker: só serve /errors/offline.html quando não há internet (ver /sw.js) -->
    <script>
      if ("serviceWorker" in navigator) {
        addEventListener("load", function () {
          navigator.serviceWorker.register("/sw.js");
        });
      }
    </script>
